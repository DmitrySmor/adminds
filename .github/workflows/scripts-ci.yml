# ============================================================
# GitHub Actions — CI для Bash-скриптов
# ============================================================
#
# Pipeline выполняет три независимые проверки:
#
#   1. ShellCheck — анализ Bash-кода
#   2. shfmt      — проверка форматирования
#   3. tests      — запуск тестов
#
# Сборки готового скрипта здесь пока НЕТ.
# Build добавим на следующем этапе.
# ============================================================

name: Scripts CI

# ============================================================
# Когда запускается CI
# ============================================================
#
# CI запускается:
#
#   - при push в ветку main
#   - при создании или изменении Pull Request
#
# Благодаря этому код проверяется как при обычном push,
# так и перед слиянием Pull Request.
# ============================================================

on:
    push:
        branches:
            - main

    pull_request:

# ============================================================
# Разрешения GitHub Actions
# ============================================================
#
# CI не должен иметь лишних прав.
#
# contents: read позволяет GitHub Actions прочитать
# содержимое репозитория через actions/checkout.
# ============================================================

permissions:
    contents: read

# ============================================================
# Jobs
# ============================================================

jobs:
    # ==========================================================
    # ShellCheck
    # ==========================================================
    #
    # ShellCheck выполняет статический анализ Bash-скриптов.
    #
    # Он позволяет находить:
    #
    #   - потенциальные ошибки;
    #   - неправильное использование переменных;
    #   - проблемы с кавычками;
    #   - подозрительные конструкции;
    #   - типичные ошибки Bash.
    #
    # Важно:
    # Мы проверяем только новую архитектуру scripts/src
    # и тесты.
    #
    # Старые bootstrap/ и setup/ пока намеренно НЕ проверяются.
    # ==========================================================

    shellcheck:
        name: ShellCheck
        runs-on: ubuntu-latest

        steps:
            # --------------------------------------------------------
            # Получаем исходный код репозитория
            # --------------------------------------------------------

            - name: Checkout repository
              uses: actions/checkout@v4

            # --------------------------------------------------------
            # Устанавливаем ShellCheck
            # --------------------------------------------------------

            - name: Install ShellCheck
              run: |
                  sudo apt-get update
                  sudo apt-get install -y shellcheck

            # --------------------------------------------------------
            # Запускаем ShellCheck
            # --------------------------------------------------------
            #
            # Используем find вместо:
            #
            #   scripts/src/tasks/*.sh
            #
            # Это важно, потому что каталоги tasks/ и workflows/
            # могут временно быть пустыми.
            #
            # find автоматически найдёт все .sh-файлы,
            # которые появятся в будущем.
            # --------------------------------------------------------

            - name: Run ShellCheck
              shell: bash
              run: |
                  find scripts/src scripts/tests \
                    -type f \
                    -name '*.sh' \
                    -print0 |
                    xargs -0 shellcheck

    # ==========================================================
    # shfmt
    # ==========================================================
    #
    # shfmt проверяет единый стиль форматирования Bash-кода.
    #
    # Опция -d не изменяет файлы.
    #
    # Если форматирование неправильное, shfmt покажет diff
    # и завершится с ошибкой.
    #
    # Поэтому CI не позволит принять плохо отформатированный код.
    # ==========================================================

    shfmt:
        name: shfmt
        runs-on: ubuntu-latest

        steps:
            # --------------------------------------------------------
            # Получаем исходный код репозитория
            # --------------------------------------------------------

            - name: Checkout repository
              uses: actions/checkout@v4

            # --------------------------------------------------------
            # Устанавливаем shfmt
            # --------------------------------------------------------

            - name: Install shfmt
              run: |
                  sudo apt-get update
                  sudo apt-get install -y shfmt

            # --------------------------------------------------------
            # Проверяем форматирование
            # --------------------------------------------------------
            #
            # Проверяется весь исходный код Bash:
            #
            #   scripts/src/
            #   scripts/tests/
            #
            # -d = показать diff, но не изменять файлы.
            # --------------------------------------------------------

            - name: Check formatting
              shell: bash
              run: |
                  shfmt -d \
                    scripts/src \
                    scripts/tests

    # ==========================================================
    # Tests
    # ==========================================================
    #
    # Здесь запускаются автоматические тесты.
    #
    # Сейчас у нас:
    #
    #   test_colors.sh
    #   test_log.sh
    #
    # В будущем сюда автоматически попадут:
    #
    #   test_input.sh
    #   test_validation.sh
    #   test_tasks.sh
    #   ...
    #
    # Благодаря glob test_*.sh новые тесты не потребуют
    # изменения CI-файла.
    # ==========================================================

    tests:
        name: Tests
        runs-on: ubuntu-latest

        steps:
            # --------------------------------------------------------
            # Получаем исходный код репозитория
            # --------------------------------------------------------

            - name: Checkout repository
              uses: actions/checkout@v4

            # --------------------------------------------------------
            # Запускаем все Bash-тесты
            # --------------------------------------------------------
            #
            # Каждый test_*.sh запускается отдельно.
            #
            # Поэтому в GitHub Actions будет видно, какой именно
            # тест завершился ошибкой.
            # --------------------------------------------------------

            - name: Run tests
              shell: bash
              run: |
                  for test in scripts/tests/test_*.sh; do
                    echo "==> Running $test"
                    bash "$test"
                  done
