name: Scripts CI

on:
    push:
        branches:
            - main

    pull_request:

permissions:
    contents: read

jobs:
    shellcheck:
        name: ShellCheck
        runs-on: ubuntu-latest

        steps:
            # Получаем исходники репозитория.
            - name: Checkout repository
              uses: actions/checkout@v4

            # Устанавливаем ShellCheck.
            - name: Install ShellCheck
              run: |
                  sudo apt-get update
                  sudo apt-get install -y shellcheck

            # Проверяем все Bash-скрипты.
            #
            # -x позволяет ShellCheck переходить по source
            # и анализировать подключаемые библиотеки.
            #
            # SC2034 отключаем только для colors.sh,
            # потому что переменные цветов предназначены
            # для использования другими скриптами.
            - name: Run ShellCheck
              shell: bash
              run: |
                  shellcheck -x \
                    scripts/src/tasks/*.sh \
                    scripts/src/workflows/*.sh \
                    scripts/tests/*.sh

                  shellcheck -x \
                    -e SC2034 \
                    scripts/src/lib/colors.sh

                  shellcheck -x \
                    scripts/src/lib/log.sh

    shfmt:
        name: shfmt
        runs-on: ubuntu-latest

        steps:
            # Получаем исходники репозитория.
            - name: Checkout repository
              uses: actions/checkout@v4

            # Устанавливаем shfmt.
            - name: Install shfmt
              run: |
                  sudo apt-get update
                  sudo apt-get install -y shfmt

            # Проверяем форматирование.
            #
            # -d означает:
            # ничего не менять, а только показать различия.
            - name: Check formatting
              shell: bash
              run: |
                  shfmt -d \
                    scripts/src \
                    scripts/tests

    tests:
        name: Tests
        runs-on: ubuntu-latest

        steps:
            # Получаем исходники репозитория.
            - name: Checkout repository
              uses: actions/checkout@v4

            # Запускаем все тесты.
            - name: Run tests
              shell: bash
              run: |
                  for test in scripts/tests/test_*.sh; do
                      echo "==> Running $test"
                      bash "$test"
                  done
